name: RC1 lockfile bootstrap

on:
  push:
    branches:
      - feat/sensemap-rc1-staging
    paths:
      - .github/workflows/rc1-lockfile-bootstrap.yml

permissions:
  contents: write
  actions: read

jobs:
  restore-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sensemap-rc1-staging
      - name: Download lockfile artifact from green main run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9738303163'
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/pnpm-lock.zip
          unzip -p /tmp/pnpm-lock.zip pnpm-lock.yaml > pnpm-lock.yaml
          test -s pnpm-lock.yaml
      - name: Commit exact CI lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already present"
            exit 0
          fi
          git commit -m "build: lock RC1 dependency graph"
          git push origin HEAD:feat/sensemap-rc1-staging
